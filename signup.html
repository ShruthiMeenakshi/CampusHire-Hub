<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusHireHub - Sign Up</title>
  <link rel="stylesheet" href="./assets/styles/signup.css" />
</head>
<body>

  <div class="signup-container">

    <!-- Left Section: Signup Form -->
    <div class="signup-section">
      <h1 class="signup-heading">Create Account</h1>

      <form id="signupForm">

        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required />
        </div>

        <div class="form-group">
          <label for="email">Email ID</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required />
        </div>

        <div class="form-group">
          <label for="role">Register As</label>
          <select id="role" name="role" required>
            <option value="">Select role</option>
            <option value="student">Student</option>
            <option value="placement officer">Placement Officer</option>
             <option value="placement coordinator">Placement Coordinator</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Create a password" required />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required />
        </div>

        <button type="submit" class="signup-btn">Sign Up</button>

        <div class="login-redirect">
          Already have an account?
          <a href="login.html" class="login-link">Login</a>
        </div>

      </form>
    </div>

    <!-- Right Section: Welcome Panel -->
    <div class="welcome-section">
      <div class="logo-placeholder">
        <img src="./media/vcetLogo.jpg" alt="VCET Logo" />
      </div>
      <div class="welcome-greeting">Join us,</div>
      <div class="welcome-message">CampusHireHub</div>
    </div>

  </div>

</body>
</html>
