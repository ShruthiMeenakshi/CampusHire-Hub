services:
  postgres:
    image: postgres:16
    container_name: campus_postgres
    environment:
      POSTGRES_DB: campushire
      POSTGRES_USER: campus_user
      POSTGRES_PASSWORD: campus_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    container_name: campus_backend
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campushire
      SPRING_DATASOURCE_USERNAME: campus_user
      SPRING_DATASOURCE_PASSWORD: campus_pass

volumes:
  postgres_data:
