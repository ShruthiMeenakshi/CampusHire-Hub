spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campushire}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO

security:
  jwt:
    secret: ${JWT_SECRET}
    expirationMs: ${JWT_EXP_MS:86400000}
