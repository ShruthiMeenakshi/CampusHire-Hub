spring:
  application:
    name: campushire
  datasource:
    url: jdbc:postgresql://postgres:5432/campushire
    username: campus_user
    password: campus_pass

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
