version: "3.9"
services:
  db:
    image: postgres:16-alpine
    container_name: campushire-db
    environment:
      POSTGRES_DB: campushire
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campushire-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/campushire
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-this-in-prod
      JWT_EXP_MS: 86400000
    depends_on:
      - db
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' "]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
