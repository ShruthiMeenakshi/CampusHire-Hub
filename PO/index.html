<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Redirecting to React /po/dashboard</title>
		<meta http-equiv="refresh" content="0; url=/po/dashboard" />
		<script>
			(function(){
				try { window.location.replace('/po/dashboard'); }
				catch (_) { window.location.href = '/po/dashboard'; }
			})();
		</script>
	</head>
	<body>
		<noscript>
			<p>JavaScript required. Please go to /po/dashboard</p>
		</noscript>
	</body>
</html>
