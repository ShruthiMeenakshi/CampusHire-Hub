<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusHire Hub — Events</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/styles/dashboard.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
</head>
<body>
    <div id="app">
        <aside id="sidebar" class="sidebar" data-include="includes/sidebar.html"></aside>

        <div class="main">
            <header id="topbar" class="topbar" data-include="includes/topbar.html"></header>

            <main class="content">
                <div class="card-header" style="margin-bottom: 16px;">
                    <h3>Upcoming Events</h3>
                    <button class="btn ghost" id="add-event-btn">Add Event</button>
                </div>
                <section class="events-grid" id="events-list">
                    <!-- Events will be listed here as cards -->
                </section>
            </main>
        </div>
    </div>

    <!-- Modal for event details -->
    <div id="event-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title"></h2>
            <p id="modal-date"></p>
            <p id="modal-description"></p>
        </div>
    </div>

    <!-- Modal for adding event -->
    <div id="add-event-modal" class="modal">
        <div class="modal-content">
            <span class="close" id="add-close">&times;</span>
            <h2>Add New Event</h2>
            <form id="add-event-form">
                <div class="form-group">
                    <label for="event-name">Event Name</label>
                    <input type="text" id="event-name" required>
                </div>
                <div class="form-group">
                    <label for="event-date">Event Date</label>
                    <input type="date" id="event-date" required>
                </div>
                <div class="form-group">
                    <label for="event-description">Description</label>
                    <textarea id="event-description" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label for="event-url">Registration URL</label>
                    <input type="url" id="event-url" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn ghost" id="cancel-add">Cancel</button>
                    <button type="submit" class="btn primary">Add Event</button>
                </div>
            </form>
        </div>
    </div>

    <script src="assets/js/events.js"></script>
</body>
</html>
