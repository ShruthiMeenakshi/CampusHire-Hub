<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusHireHub - Login</title>
    <link rel="stylesheet" href="assets/styles/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-section">
    
            <h1 class="login-heading">Login</h1>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email ID</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <div class="checkbox-row">
                    <div class="remember-me">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <label for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">Login</button>

                <div class="create-account">
                    New user? <a href="#" class="create-account-link">Create an account</a>
                </div>
            </form>
        </div>

        <div class="welcome-section">
            <div class="logo-placeholder">
                <div>
                    <img src="media/vcetLogo.jpg" alt="CampusHireHub Logo">
                </div>
            </div>
            <div class="welcome-greeting">Hello there,</div>
            <div class="welcome-message">Welcome back</div>
        </div>
    </div>
</body>
</html>
