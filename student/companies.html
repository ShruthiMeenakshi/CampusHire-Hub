<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusHire Hub — Companies</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="assets/styles/dashboard.css" />
    <link rel="stylesheet" href="assets/styles/companies.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
</head>

<body>
    <div id="app">
        <aside id="sidebar" class="sidebar" data-include="includes/sidebar.html"></aside>

        <div class="main">
            <header id="topbar" class="topbar" data-include="includes/topbar.html"></header>
            <main class="content">
                <div class="card-header" style="margin-bottom: 16px;">
                    <h3>Recruiting Companies</h3>

                    <div style="display:flex; gap:10px;">
                        <input type="text" id="searchBox" placeholder="Search company..." class="input">

                        <select id="ctcFilter" class="input">
                            <option value="">All CTC</option>
                            <option value="5">5+ LPA</option>
                            <option value="10">10+ LPA</option>
                            <option value="20">20+ LPA</option>
                            <option value="30">30+ LPA</option>
                        </select>
                    </div>
                </div>

                <div id="companiesContainer" class="companies-grid"></div>
            </main>



        </div>
    </div>
    <script src="assets/js/includes-loader.js"></script>
    <script src="assets/js/companies.js"></script>
</body>

</html>
