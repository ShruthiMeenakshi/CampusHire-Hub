<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusHire Hub — Student Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles/dashboard.css" />
  <link rel="stylesheet" href="assets/styles/profile.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar" data-include="includes/sidebar.html"></aside>

    <div class="main">
      <header id="topbar" class="topbar" data-include="includes/topbar.html"></header>

      <main class="content">
        <article class="card">
          <div class="card-header">
            <h3>Student Profile</h3>
            <span class="muted">Update your personal and academic details</span>
          </div>
          
          <!-- Wizard Progress -->
          <div class="wizard-progress">
            <ol class="wizard-steps">
              <li class="active" data-step="1">Personal</li>
              <li data-step="2">Academic</li>
              <li data-step="3">Links & Skills</li>
              <li data-step="4">Demographics</li>
              <li data-step="5">Address</li>
              <li data-step="6">Family</li>
              <li data-step="7">IDs</li>
              <li data-step="8">Placement</li>
            </ol>
          </div>

          <!-- Step Navigation & Status -->
          <div class="step-navigation">
            <div class="step-info">
              <span class="current-step">Step 1 of 8</span>
              <span class="step-title">Personal Information</span>
            </div>
          </div>
          <form id="profileForm" class="wizard-form" autocomplete="on">
            <!-- Step 1: Personal -->
            <section class="form-step active" data-step="1">
              <div class="step-content">
                <div class="form-grid">
                  <div class="form-field">
                    <label for="nameWithInitials">Name with Initials</label>
                    <input type="text" id="nameWithInitials" name="nameWithInitials" placeholder="NAME With Initials (ex: Dheeraj T R)" />
                  </div>
                  
                  <div class="form-field">
                    <label for="fullNameWithoutInitials">Full Name (Without Initials)</label>
                    <input type="text" id="fullNameWithoutInitials" name="fullNameWithoutInitials"
                      placeholder="FULL NAME WITHOUT INITIALS (ex: Sethu Rajan)" />
                  </div>

                  <div class="form-field">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="e.g., Priya Sharma" required />
                  </div>
                  <div class="form-field">
                    <label for="universityRegNo">University Register Number</label>
                    <input type="text" id="universityRegNo" name="universityRegNo" placeholder="University Reg. No. (ex: 913119106019)" />
                  </div>
                  <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="e.g., priya@vcet.edu" required />
                  </div>
                  
                  <div class="form-field">
                    <label for="altEmail">Alternate Email (optional)</label>
                    <input type="email" id="altEmail" name="altEmail" placeholder="If same as primary, you may re-enter the same email" />
                  </div>
                  <div class="form-field">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" placeholder="e.g., 9876543210" pattern="[0-9]{10}" required />
                  </div>
                  <div class="form-field">
                    <label for="altPhone">Alternate Phone</label>
                    <input type="tel" id="altPhone" name="altPhone" placeholder="e.g., 9876543210" pattern="[0-9]{10}" />
                  </div>
                </div>
              </div>
            </section>

            <!-- Step 2: Academic -->
            <section class="form-step" data-step="2" hidden>
              <div class="step-content">
                <div class="form-grid">
                  <div class="form-field">
                    <label for="department">Department</label>
                    <select id="department" name="department" required>
                      <option value="">Select department</option>
                      <option>CSE</option>
                      <option>IT</option>
                      <option>ECE</option>
                      <option>EEE</option>
                      <option>ME</option>
                    </select>
                  </div>
                  <div class="form-field">
                    <label for="degree">Degree</label>
                    <select id="degree" name="degree" required>
                      <option value="">Select degree</option>
                      <option>B.E</option>
                      <option>B.Tech</option>
                      <option>M.Tech</option>
                    </select>
                  </div>
                  <div class="form-field">
                    <label for="year">Year</label>
                    <select id="year" name="year" required>
                      <option value="">Select year</option>
                      <option>1</option>
                      <option>2</option>
                      <option>3</option>
                      <option>4</option>
                    </select>
                  </div>
                  <div class="form-field">
                    <label for="cgpa">CGPA</label>
                    <input type="number" id="cgpa" name="cgpa" min="0" max="10" step="0.01" placeholder="e.g., 8.45" />
                  </div>
                  <div class="form-field">
                    <label for="sem1Gpa">Semester 1 GPA</label>
                    <input type="number" id="sem1Gpa" name="sem1Gpa" min="0" max="10" step="0.01" placeholder="e.g., 8.25" />
                  </div>
                  
                  <div class="form-field">
                    <label for="sem2Gpa">Semester 2 GPA</label>
                    <input type="number" id="sem2Gpa" name="sem2Gpa" min="0" max="10" step="0.01" placeholder="e.g., 8.10" />
                  </div>
                  
                  <div class="form-field">
                    <label for="sem3Gpa">Semester 3 GPA</label>
                    <input type="number" id="sem3Gpa" name="sem3Gpa" min="0" max="10" step="0.01" placeholder="e.g., 8.40" />
                  </div>
                  
                  <div class="form-field">
                    <label for="sem4Gpa">Semester 4 GPA</label>
                    <input type="number" id="sem4Gpa" name="sem4Gpa" min="0" max="10" step="0.01" placeholder="e.g., 8.60" />
                  </div>
                  
                  <div class="form-field">
                    <label for="sem5Gpa">Semester 5 GPA</label>
                    <input type="number" id="sem5Gpa" name="sem5Gpa" min="0" max="10" step="0.01" placeholder="e.g., 8.75" />
                  </div>
                  
                  <div class="form-field">
                    <label for="sem6Gpa">Semester 6 GPA</label>
                    <input type="number" id="sem6Gpa" name="sem6Gpa" min="0" max="10" step="0.01" placeholder="e.g., 8.90" />
                  </div>
                  
                  <div class="form-field">
                    <label for="sem7Gpa">Semester 7 GPA</label>
                    <input type="number" id="sem7Gpa" name="sem7Gpa" min="0" max="10" step="0.01" placeholder="e.g., 9.00" />
                  </div>
                  
                  <div class="form-field">
                    <label for="sem8Gpa">Semester 8 GPA</label>
                    <input type="number" id="sem8Gpa" name="sem8Gpa" min="0" max="10" step="0.01" placeholder="e.g., 9.10" />
                  </div>
                  <div class="form-field">
                    <label for="tenthPercentage">10th Percentage</label>
                    <input type="number" id="tenthPercentage" name="tenthPercentage" min="0" max="100" step="0.01" placeholder="e.g., 85.5" />
                  </div>
                  <div class="form-field">
                    <label for="twelfthPercentage">12th Percentage</label>
                    <input type="number" id="twelfthPercentage" name="twelfthPercentage" min="0" max="100" step="0.01" placeholder="e.g., 88.0" />
                  </div>
                  <div class="form-field">
                    <label for="tenthMathsMark">10th Maths Mark</label>
                    <input type="number" id="tenthMathsMark" name="tenthMathsMark" min="0" max="100" step="1" placeholder="e.g., 92"
                      required />
                  </div>
                  
                  <div class="form-field">
                    <label for="twelfthMathsMark">12th Maths Mark</label>
                    <input type="number" id="twelfthMathsMark" name="twelfthMathsMark" min="0" max="100" step="1" placeholder="e.g., 88"
                      required />
                  </div>
                  <div class="form-field">
                    <label for="backlogs">Current Backlogs</label>
                    <input type="number" id="backlogs" name="backlogs" min="0" step="1" placeholder="e.g., 0" />
                  </div>
                  <div class="form-field">
                    <label for="pastBacklogs">Past Backlogs</label>
                    <input type="number" id="pastBacklogs" name="pastBacklogs" min="0" step="1" placeholder="e.g., 2" />
                  </div>
                  <div class="form-field">
                    <label for="diplomaPercentage">Diploma Marks (%)</label>
                    <input type="number" id="diplomaPercentage" name="diplomaPercentage" step="0.01"
                      placeholder="Diploma Marks in % (Eg. 74.32)" />
                  </div>
                  
                  <div class="form-field">
                    <label for="courseGap">Course Gap (Years)</label>
                    <input type="number" id="courseGap" name="courseGap" min="0" step="1" placeholder="Course GAP in years" />
                  </div>
                  
                  <div class="form-field">
                    <label for="cutoffMarks">12th Cut Off Marks</label>
                    <input type="number" id="cutoffMarks" name="cutoffMarks" step="0.01" placeholder="12th Cut off marks (ex: 178.50)" />
                  </div>
                  
                  <div class="form-field">
                    <label for="mediumOfInstruction">Medium of Instruction</label>
                    <input type="text" id="mediumOfInstruction" name="mediumOfInstruction" placeholder="Medium of instruction" />
                  </div>
                </div>
              </div>
            </section>

            <!-- Step 3: Links & Skills -->
            <section class="form-step" data-step="3" hidden>
              <div class="step-content">
                <div class="form-grid">
                  <div class="form-field col-span-2">
                    <label for="skills">Skills</label>
                    <input type="text" id="skills" name="skills" placeholder="e.g., Java, Python, React, SQL" />
                  </div>
                  <div class="form-field">
                    <label for="resumeUrl">Resume URL</label>
                    <input type="url" id="resumeUrl" name="resumeUrl" placeholder="e.g., https://drive.google.com/..." />
                  </div>
                  <div class="form-field">
                    <label for="portfolioUrl">Portfolio URL</label>
                    <input type="url" id="portfolioUrl" name="portfolioUrl" placeholder="e.g., https://priya.dev" />
                  </div>
                  <div class="form-field col-span-2">
                    <label for="linkedinUrl">LinkedIn URL</label>
                    <input type="url" id="linkedinUrl" name="linkedinUrl" placeholder="e.g., https://www.linkedin.com/in/yourhandle" />
                  </div>
                  <div class="form-field col-span-2">
                    <label for="githubUrl">GitHub URL</label>
                    <input type="url" id="githubUrl" name="githubUrl" placeholder="e.g., https://github.com/yourhandle" />
                  </div>
                  <div class="form-field col-span-2">
                    <label for="leetcodeUrl">LeetCode URL</label>
                    <input type="url" id="leetcodeUrl" name="leetcodeUrl" placeholder="e.g., https://leetcode.com/yourhandle" />
                  </div>
                  <div class="form-field col-span-2">
                    <label for="skillCertifications">Skill Certifications</label>
                    <input type="text" id="skillCertifications" name="skillCertifications"
                      placeholder="If any Skill Certifications Obtained Name the Skill" />
                  </div>
                  
                  <div class="form-field">
                    <label for="certificationDuration">Certification Duration</label>
                    <input type="text" id="certificationDuration" name="certificationDuration" placeholder="Duration of the course" />
                  </div>
                  
                  <div class="form-field col-span-2">
                    <label for="certificationVendor">Certification Vendor / Authority</label>
                    <input type="text" id="certificationVendor" name="certificationVendor"
                      placeholder="Certification Vendor/Authority/Agency Name" />
                  </div>
                </div>
              </div>
            </section>

            <!-- Step 4: Demographics -->
            <section class="form-step" data-step="4" hidden>
              <div class="step-content">
                <div class="form-grid">
                  <div class="form-field">
                    <label for="dateOfBirth">Date of Birth</label>
                    <input type="date" id="dateOfBirth" name="dateOfBirth" required />
                  </div>
                  <div class="form-field">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                      <option value="">Select gender</option>
                      <option>Male</option>
                      <option>Female</option>
                      <option>Other</option>
                      <option>Prefer not to say</option>
                    </select>
                  </div>
                  <div class="form-field">
                    <label for="residentialStatus">Residential Status</label>
                    <select id="residentialStatus" name="residentialStatus" required>
                      <option value="">Select residential status</option>
                      <option>Hosteller</option>
                      <option>Day Scholar</option>
                    </select>
                  </div>
                  <div class="form-field">
                    <label for="Community">Community</label>
                    <select id="Community" name="community" required>
                      <option value="">Select community</option>
                      <option>General</option>
                      <option>OBC</option>
                      <option>SC</option>
                      <option>ST</option>
                    </select>
                  </div>
                  <div class="form-field">
                    <label for="nationality">Nationality</label>
                    <input type="text" id="nationality" name="nationality" placeholder="e.g., Indian" />
                  </div>
                  <div class="form-field">
                    <label for="ruralUrban">Rural / Urban</label>
                    <select id="ruralUrban" name="ruralUrban">
                      <option value="">Select</option>
                      <option>Rural</option>
                      <option>Urban</option>
                    </select>
                  </div>
                </div>
              </div>
            </section>

            <!-- Step 5: Address -->
            <section class="form-step" data-step="5" hidden>
              <div class="step-content">
                <div class="form-grid">
                  <div class="form-field col-span-2">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" placeholder="e.g., 123 Main Street, City, State, Postal Code" rows="3"></textarea>
                  </div>
                  <div class="form-field">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" placeholder="e.g., Pune" />
                  </div>
                  <div class="form-field">
                    <label for="state">State</label>
                    <input type="text" id="state" name="state" placeholder="e.g., Maharashtra" />
                  </div>
                  <div class="form-field">
                    <label for="pincode">Pincode</label>
                    <input type="text" id="pincode" name="pincode" placeholder="e.g., 411001" pattern="[0-9]{6}" />
                  </div>
                </div>
              </div>
            </section>

            <!-- Step 6: Family & Emergency -->
            <section class="form-step" data-step="6" hidden>
              <div class="step-content">
                <div class="form-grid">
                  <div class="form-field">
                    <label for="fatherName">Father's Name</label>
                    <input type="text" id="fatherName" name="fatherName" placeholder="e.g., Mr. Sharma" />
                  </div>
                  <div class="form-field">
                    <label for="fatherOccupation">Father's Occupation</label>
                    <input type="text" id="fatherOccupation" name="fatherOccupation" placeholder="Father's Occupation" />
                  </div>

                  <div class="form-field">
                    <label for="motherName">Mother's Name</label>
                    <input type="text" id="motherName" name="motherName" placeholder="e.g., Mrs. Sharma" />
                  </div>
                  <div class="form-field">
                    <label for="motherOccupation">Mother's Occupation</label>
                    <input type="text" id="motherOccupation" name="motherOccupation" placeholder="Mother's Occupation" />
                  </div>
                  <div class="form-field">
                    <label for="emergencyContact">Emergency Contact</label>
                    <input type="tel" id="emergencyContact" name="emergencyContact" placeholder="e.g., 9876543210" pattern="[0-9]{10}" />
                  </div>
                  <div class="form-field col-span-2">
                    <label for="emergencyContactName">Emergency Contact Person Name</label>
                    <input type="text" id="emergencyContactName" name="emergencyContactName" placeholder="e.g., Relative's Name" />
                  </div>
                  <div class="form-field">
                    <label for="numberOfSiblings">Number of Siblings</label>
                    <input type="number" id="numberOfSiblings" name="numberOfSiblings" min="0" step="1" placeholder="e.g., 2" />
                  </div>
                  <div class="form-field">
                    <label for="siblingDetails">Sibling Details</label>
                    <input type="text" id="siblingDetails" name="siblingDetails" placeholder="e.g., Brother (22), Sister (20)" />
                  </div>
                </div>
              </div>
            </section>

            <!-- Step 7: IDs -->
            <section class="form-step" data-step="7" hidden>
              <div class="step-content">
                <div class="form-grid">
                  <div class="form-field">
                    <label for="aadharAvailable">Is Aadhar Available?</label>
                    <select id="aadharAvailable" name="aadharAvailable">
                      <option value="">Select</option>
                      <option value="Y">Yes</option>
                      <option value="N">No</option>
                    </select>
                  </div>
                  <div class="form-field">
                    <label for="nameAsPerAadhar">Name as per Aadhar</label>
                    <input type="text" id="nameAsPerAadhar" name="nameAsPerAadhar" placeholder="Name as per Aadhar card" />
                  </div>
                  <div class="form-field">
                    <label for="aadharNumber">Aadhar Number</label>
                    <input type="text" id="aadharNumber" name="aadharNumber" placeholder="e.g., XXXX XXXX XXXX" pattern="[0-9X ]{14}" />
                  </div>
                  <div class="form-field">
                    <label for="panAvailable">Is PAN Card Available?</label>
                    <select id="panAvailable" name="panAvailable">
                      <option value="">Select</option>
                      <option value="Y">Yes</option>
                      <option value="N">No</option>
                    </select>
                  </div>
                  <div class="form-field">
                    <label for="panNumber">PAN Number</label>
                    <input type="text" id="panNumber" name="panNumber" placeholder="e.g., ABCDE1234F" pattern="[A-Z]{5}[0-9]{4}[A-Z]" />
                  </div>
                  <div class="form-field">
                    <label for="passportAvailable">Is Passport Available?</label>
                    <select id="passportAvailable" name="passportAvailable">
                      <option value="">Select</option>
                      <option value="Y">Yes</option>
                      <option value="N">No</option>
                    </select>
                  </div>
                  <div class="form-field">
                    <label for="passportNumber">Passport Number</label>
                    <input type="text" id="passportNumber" name="passportNumber" placeholder="e.g., A12345678" pattern="[A-Z0-9]{9}" />
                  </div>
                  <div class="form-field">
                    <label for="rationCard">Ration Card Number</label>
                    <input type="text" id="rationCard" name="rationCard" placeholder="e.g., R1234567890" />
                  </div>
                </div>
              </div>
            </section>

            <!-- Step 8: Placement -->
            <section class="form-step" data-step="8" hidden>
              <div class="step-content">
                <div class="form-grid">
                  <div class="form-field">
                    <label for="placementInterested">Interested in Placement</label>
                    <select id="placementInterested" name="placementInterested" required>
                      <option value="">Select option</option>
                      <option value="yes">Yes</option>
                      <option value="no">No</option>
                    </select>
                  </div>
                  <div class="form-field">
                    <label for="placementReason">If Not Interested, Reason</label>
                    <input type="text" id="placementReason" name="placementReason" placeholder="e.g., Pursuing further studies, Already placed, etc." />
                  </div>       
                  <div class="form-field">
                    <label for="becStatus">BEC Status</label>
                    <select id="becStatus" name="becStatus">
                      <option value="">Select</option>
                      <option>Yes</option>
                      <option>No</option>
                    </select>
                  </div>
                  <div class="form-field col-span-2">
                    <label class="checkbox-label">
                      <input type="checkbox" id="agreeToTerms" name="agreeToTerms" required />
                      <span>I agree to the placement registration terms and conditions</span>
                    </label>
                  </div>
                </div>
              </div>
            </section>

            <!-- Final Submit Actions -->
            <div class="final-actions" hidden>
              <div class="form-actions">
                <button type="submit" class="btn ghost save-btn">
                  <i class="ph ph-floppy-disk"></i><span>Save Profile</span>
                </button>
                <button type="reset" class="btn ghost">
                  <i class="ph ph-arrow-counter-clockwise"></i><span>Reset</span>
                </button>
                <button type="button" class="btn ghost" id="btn-overview">
                  <i class="ph ph-gauge"></i><span>Go to Overview</span>
                </button>
              </div>
            </div>
            <div class="step-buttons">
              <button type="button" class="btn ghost prev-step" disabled>
                <i class="ph ph-arrow-left"></i> Back
              </button>
              <button type="button" class="btn ghost next-step">
                Next <i class="ph ph-arrow-right"></i>
              </button>
            </div>
          </form>
        </article>
      </main>
    </div>
  </div>

  <script src="assets/js/dashboard.js"></script>
  <script src="assets/js/profile.js"></script>
</body>
</html>
